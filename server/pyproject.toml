[project]
name = "livesubs"
version = "0.1.0"
description = "Near-live Japanese + English subtitles for YouTube streams: inference server"
readme = "../README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.1",
    "onnxruntime>=1.30.0",
]

[project.optional-dependencies]
# GPU inference stack. Kept out of the base install so CI never pulls CUDA.
gpu = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
livesubs = "livesubs.__main__:main"

[dependency-groups]
bench = [
    "jiwer>=4.0.0",
    "pyarrow>=25.0.1",
    "soundfile>=0.14.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-include = ["../tools/*.py", "../benchmarks/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Japanese text in strings/comments is intended
    "PT018",  # compound asserts read better in protocol tests
]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "../tools"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "onnxruntime.*", "soxr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "gpu: needs the real models on a CUDA GPU (excluded by default)",
    "e2e: end-to-end replay through a running server (excluded by default)",
]
addopts = "-m 'not gpu and not e2e'"
